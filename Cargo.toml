[package]
name = "easy-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful"] }
http = "1"
http-body = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"
